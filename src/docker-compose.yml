services:
  unstable_service:
      build:
        context: ./backend/UnstableService
        dockerfile: Dockerfile
      ports:
        - "5000:8080"
      container_name: unstable_service
      restart: unless-stopped

  data_ingestor_service:
    build:
      context: .
      dockerfile: ./backend/DataIngestorService/DataIngestorService.Api/Dockerfile
    ports:
      - "5010:8080"
    env_file:
      - .env/data_ingestor_service.env
    container_name: data_ingestor_service
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  data_processor_service:
    build:
      context: .
      dockerfile: ./backend/DataProcessorService/DataProcessorService.Api/Dockerfile
    ports:
      - "5020:8080"
    env_file:
      - .env/data_processor_service.env
    container_name: data_processor_service
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_LOG_DIRS: /var/lib/kafka/data

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 10"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  kafka_data:
  postgres_data: